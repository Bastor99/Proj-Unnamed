<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Meu Projeto</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    >

    <link
        rel="stylesheet"
        href="../styles/login-styles.css"
    >

</head>


<body>

    <!-- Navbar -->
    <nav class="navbar">

        <div class="container-fluid">

           <a class="navbar-brand" href="#">
                <i class="bi bi-rocket-takeoff"></i>
                Meu Projeto
            </a>

        </div>

    </nav>


    <!-- Hero -->
    <section class="login-hero">

        <div class="hero-content">

            <h1>
                Bem-vindo!
            </h1>

            <p>
                Entre na sua conta para continuar
            </p>

        </div>

    </section>


    <!-- Login -->
    <main class="login-section">

        <div class="container">

            <div class="row justify-content-center">

                <div class="col-12 col-md-8 col-lg-5">

                    <div class="custom-card login-card">


                        <!-- Cabeçalho -->
                        <div class="card-header gradient-1">

                            <div class="login-icon">

                                <i class="bi bi-person-circle"></i>

                            </div>

                        </div>


                        <!-- Corpo -->
                        <div class="card-body">

                            <h2 class="card-title text-center">
                                Acessar conta
                            </h2>

                            <p class="card-text text-center">
                                Preencha seus dados para entrar no sistema.
                            </p>


                            <!-- Formulário -->
                            <form id="loginForm">


                                <!-- Nome -->
                                <div class="form-group">

                                    <label for="nome">
                                        Nome
                                    </label>

                                    <input
                                        type="text"
                                        id="nome"
                                        name="nome"
                                        class="form-control"
                                        placeholder="Digite seu nome"
                                        required
                                    >

                                </div>


                                <!-- Email -->
                                <div class="form-group">

                                    <label for="email">
                                        E-mail
                                    </label>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        class="form-control"
                                        placeholder="Digite seu e-mail"
                                        required
                                    >

                                </div>


                                <!-- Senha -->
                                <div class="form-group">

                                    <label for="senha">
                                        Senha
                                    </label>

                                    <input
                                        type="password"
                                        id="senha"
                                        name="senha"
                                        class="form-control"
                                        placeholder="Digite sua senha"
                                        required
                                    >

                                </div>


                                <!-- Opções -->
                                <div class="login-options">

                                    <div class="remember">

                                        <input
                                            type="checkbox"
                                            id="remember"
                                        >

                                        <label for="remember">
                                            Lembrar de mim
                                        </label>

                                    </div>

                                    <a href="#">
                                        Esqueci minha senha
                                    </a>

                                </div>


                                <!-- Botão -->
                                <button
                                    type="submit"
                                    class="btn btn-custom login-button"
                                >

                                    <i class="bi bi-box-arrow-in-right"></i>

                                    Entrar

                                </button>

                            </form>


                            <!-- Cadastro -->
                            <div class="register-section">

                                <p>
                                    Ainda não possui uma conta?
                                </p>

                                <a
                                    href="cadastro.html"
                                    class="register-link"
                                >
                                    Criar uma conta
                                </a>

                            </div>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <p>
            © 2026 Meu Projeto.
            Todos os direitos reservados.
        </p>

    </footer>


    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript de autenticação -->
    <script src="../scripts/auth.js"></script>

</body>

</html>
